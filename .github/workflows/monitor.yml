
name: Stock Monitor

on:
  # GitHub Actions uses UTC. These windows correspond to 09:30-11:30 and
  # 13:00-15:00 China Standard Time, Monday through Friday.
  schedule:
    - cron: "30-59/5 1 * * 1-5"
    - cron: "*/5 2 * * 1-5"
    - cron: "0-30/5 3 * * 1-5"
    - cron: "*/5 5-6 * * 1-5"
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run multi-source quote test
        run: python multi_source_test.py --code 000651 --name 格力电器
